{%- comment -%}
  Renders a table cell whose background is filled left-to-right to
  `percentage`. The fill amount is passed as a custom property so that a single
  rule in main.scss can style every cell; emitting a <style> block per row
  produced invalid markup and duplicate ids whenever two rows shared a value.
{%- endcomment -%}
<td rowspan="{{ include.rowspan }}" class="progress-cell" style="--fill: {{ include.percentage }}%">
  {{ include.percentage }}%
</td>
